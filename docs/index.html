<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>haasSender</title>
<style>
/* HAAS pendant chrome.
   Colours sampled from figure F2.26 of the 2014 Mill Operator's Manual rather than
   guessed: the greys, the cyan, the RESET orange and the yellow accent are the
   values that appear in the manual artwork. */

:root {
  /* palette, straight off the artwork */
  --bezel:        #cccbcb;
  --panel-black:  #231f20;
  --cyan:         #0090c2;
  --key-hi:       #e9e9e9;
  --key-face:     #bdbcbc;
  --key-mid:      #a7a5a6;
  --key-lo:       #918f8f;
  --key-edge:     #7b7979;
  --reset-hi:     #f47216;
  --reset-lo:     #d55415;
  --reset-edge:   #61090b;
  --yellow:       #ffd200;
  /* The artwork prints the shifted legends in #f9af15, and that value is a trap
     on a screen: its relative luminance is ~0.51 and the key face #bdbcbc is
     ~0.51 too, so the glyph carried NO brightness edge — 1.0:1, readable only by
     hue, which at this size is not readable at all. Deepened deliberately. There
     is no bright yellow that escapes this: bright yellow IS high luminance, and
     so is a light grey key, so any yellow that separates from the face is a dark
     one. Outlining it instead was tried and clogs the counters at 9px. */
  --yellow-deep:  #8a5400;

  /* the classic screen */
  --screen-bg:    #0d3b1e;
  --screen-pane:  #14522a;
  --screen-text:  #e8f6e8;
  --screen-dim:   #8fc79b;
  --screen-key:   #ffe680;
  --screen-active:#ffffff;
  --screen-alarm: #c8102e;

  /* one unit drives every dimension, so the pendant scales as a whole */
  --u: clamp(7px, 0.95vw, 14px);

  --key-r: calc(var(--u) * 0.55);
  --font-key: "Arial Narrow", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-screen: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #21252a;
  font-family: var(--font-key);
  -webkit-font-smoothing: antialiased;
}

/* ---------------------------------------------------------------- the pendant */

.pendant {
  display: grid;
  grid-template-columns: calc(var(--u) * 20) 1fr;
  gap: calc(var(--u) * 1.5);
  /* Tight top and bottom, because the whole panel has to clear 1080 and every
     pixel of margin is one the display does not get. The sides are unchanged. */
  padding: calc(var(--u) * .8) calc(var(--u) * 2.3) calc(var(--u) * .8) calc(var(--u) * .9);
  border-radius: calc(var(--u) * 0.6);
  /* brushed stainless */
  background:
    repeating-linear-gradient(90deg,
      rgba(255,255,255,.055) 0 1px, rgba(0,0,0,.05) 1px 2px, transparent 2px 4px),
    linear-gradient(160deg, #d9dde0, #b8bec3 45%, #cdd2d6 70%, #aeb4b9);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7),
    inset 0 -2px 6px rgba(0,0,0,.28),
    0 calc(var(--u) * 1.2) calc(var(--u) * 3) rgba(0,0,0,.55);
}

/* Screws in all four corners, as on the real panel. Real elements rather than
   ::before/::after, because two pseudo-elements cannot make four rivets and every
   trick that stretches them to (gradient pairs, offset box-shadows) costs more
   than the markup it saves. */
.pendant { position: relative; }
.rivet {
  position: absolute; width: calc(var(--u) * .9); height: calc(var(--u) * .9);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #eceff1, #7d858c 60%, #5c6368);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
  pointer-events: none;
}
.rivet.tl { top: calc(var(--u) * .55); left: calc(var(--u) * .55); }
.rivet.tr { top: calc(var(--u) * .55); right: calc(var(--u) * .55); }
.rivet.bl { bottom: calc(var(--u) * .55); left: calc(var(--u) * .55); }
.rivet.br { bottom: calc(var(--u) * .55); right: calc(var(--u) * .55); }

/* ------------------------------------------------------------- left-hand column */

.column {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--u) * 1.1);
  padding-top: calc(var(--u) * 1.4);
}

.logo {
  width: calc(var(--u) * 9); height: calc(var(--u) * 9);
  border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 38% 30%, #f2f4f5, #9aa1a7 55%, #6e757b);
  box-shadow: inset 0 0 0 calc(var(--u)*.22) #babfc4, 0 2px 5px rgba(0,0,0,.45);
}
.logo svg { width: 78%; height: 78%; }

.legend {
  font-size: calc(var(--u) * .82);
  letter-spacing: .06em;
  color: #23282c;
  text-align: center;
  font-weight: 700;
}

.pair { display: flex; gap: calc(var(--u) * 2.2); }
.pair > div { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*.4); }

/* round illuminated pushbuttons */
.pb {
  width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4);
  border-radius: 50%; border: none; cursor: pointer;
  box-shadow: inset 0 calc(var(--u)*.18) 0 rgba(255,255,255,.55),
              inset 0 calc(var(--u)*-.25) calc(var(--u)*.3) rgba(0,0,0,.4),
              0 calc(var(--u)*.2) calc(var(--u)*.4) rgba(0,0,0,.45);
}
.pb:active { transform: translateY(1px); filter: brightness(1.25); }
.pb.green { background: radial-gradient(circle at 38% 32%, #7ee89a, #1f9c46 60%, #12703200); background-color: #1f9c46; }
.pb.red   { background: radial-gradient(circle at 38% 32%, #ff9a90, #c0281c 60%, #8b160e00); background-color: #c0281c; }

/* emergency stop */
.estop {
  width: calc(var(--u) * 8); height: calc(var(--u) * 8);
  border-radius: 50%; border: none; cursor: pointer; position: relative;
  background: radial-gradient(circle at 50% 45%, #ffe14d, #f2c200 62%, #c99e00);
  box-shadow: 0 calc(var(--u)*.3) calc(var(--u)*.6) rgba(0,0,0,.5);
  display: grid; place-items: center;
}
.estop i {
  display: block; width: 66%; height: 66%; border-radius: 50%;
  background: radial-gradient(circle at 42% 34%, #ff6a5a, #c8102e 62%, #8c0a1f);
  box-shadow: inset 0 calc(var(--u)*-.3) calc(var(--u)*.4) rgba(0,0,0,.45),
              inset 0 calc(var(--u)*.2) 0 rgba(255,255,255,.3);
}
.estop:active i { filter: brightness(.85); }

/* handle-jog dial */
.dial {
  width: calc(var(--u) * 9.5); height: calc(var(--u) * 9.5);
  border-radius: 50%; position: relative; cursor: grab;
  background: conic-gradient(from 0deg, #d7dbde, #aeb4b9 12%, #d7dbde 25%, #aeb4b9 37%,
              #d7dbde 50%, #aeb4b9 62%, #d7dbde 75%, #aeb4b9 87%, #d7dbde);
  box-shadow: inset 0 0 0 calc(var(--u)*.35) #9aa1a7, 0 calc(var(--u)*.25) calc(var(--u)*.5) rgba(0,0,0,.45);
  display: grid; place-items: center;
}
.dial:active { cursor: grabbing; }
/* graduated ring, as on the real handle */
.dial::before {
  content: ""; position: absolute; inset: calc(var(--u) * .55); border-radius: 50%;
  background: repeating-conic-gradient(#5c6368 0 1.2deg, transparent 1.2deg 9deg);
  -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%);
  mask: radial-gradient(circle, transparent 62%, #000 63%);
  opacity: .75;
}
.dial i {
  width: 52%; height: 52%; border-radius: 50%;
  background: radial-gradient(circle at 38% 30%, #f2f4f5, #9aa1a7 62%, #767d83);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  display: grid; place-items: center;
}
.dial i::after {   /* the knurl mark, so rotation is legible */
  content: ""; width: calc(var(--u)*.5); height: calc(var(--u)*.5); border-radius: 50%;
  background: #5c6368; transform: translateY(calc(var(--u) * -1.7));
}

/* ------------------------------------------------------------------ right side */

/* The width is deliberate, and it has to be. Left to itself the pendant was as
   wide as the longest line of monospace text that happened to be in a pane — so
   editing a hint string silently resized the whole panel, and shortening a few of
   them took 89px off it. The keyboard only needs 1202px at u=14; the screen asked
   for more. Pin the stack and let the keyboard stretch into it. */
.stack {
  display: flex; flex-direction: column;
  gap: calc(var(--u) * .7);
  width: calc(var(--u) * 110);
  min-width: 0;
}

/* ---------------------------------------------------------------- the keyboard */

.keyboard {
  background: var(--bezel);
  border-radius: calc(var(--u) * .5);
  padding: calc(var(--u) * .8);
  box-shadow: inset 0 0 0 1px #b4b3b3, inset 0 1px 0 rgba(255,255,255,.8);
  display: grid;
  grid-template-columns: auto auto auto;
  grid-template-areas:
    "function display mode"
    "jog      cursor  mode"
    "overrides alpha  numeric";
  gap: calc(var(--u) * .7);
  align-items: start;
}
.grp-function  { grid-area: function; }
.grp-jog       { grid-area: jog; }
.grp-overrides { grid-area: overrides; }
.grp-display   { grid-area: display; }
.grp-cursor    { grid-area: cursor; }
.grp-mode      { grid-area: mode; }
.grp-alpha     { grid-area: alpha; }
.grp-numeric   { grid-area: numeric; }

.group {
  display: grid;
  gap: calc(var(--u) * .32);
  padding: calc(var(--u) * .42);
  border-radius: calc(var(--u) * .45);
  background: #c4c3c3;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.14);
}
.group.panel-black { background: var(--panel-black); }
.group.panel-cyan  { background: var(--cyan); }

.group h2 {
  grid-column: 1 / -1;
  margin: 0 0 calc(var(--u) * .1);
  font-size: calc(var(--u) * 1.15);
  font-weight: 700;
  letter-spacing: .16em;
  text-align: center;
  color: #fff;
}

/* a plain text label sitting in the grid, e.g. SPINDLE and CURSOR */
.group .label {
  display: grid; place-items: center;
  font-size: calc(var(--u) * .82); font-weight: 700; letter-spacing: .06em;
}
.group.panel-black .label { color: #fff; }
.group.panel-cyan .label  { color: #fff; font-size: calc(var(--u) * 1.05); letter-spacing: .1em; }

/* ---------------------------------------------------------------------- a key */

.key {
  position: relative;
  min-width: calc(var(--u) * 4.6);
  min-height: calc(var(--u) * 3.1);
  padding: calc(var(--u) * .2) calc(var(--u) * .25);
  border: none;
  border-radius: var(--key-r);
  cursor: pointer;
  font-family: inherit;
  font-size: calc(var(--u) * .78);
  font-weight: 700;
  line-height: 1.04;
  letter-spacing: .01em;
  color: #17191b;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, var(--key-hi) 0%, var(--key-face) 42%, var(--key-mid) 72%, var(--key-lo) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.55),
    0 0 0 1px var(--key-edge),
    0 calc(var(--u) * .16) 0 #6f6d6d,
    0 calc(var(--u) * .3) calc(var(--u) * .35) rgba(0,0,0,.4);
}
.key:active, .key.down {
  transform: translateY(calc(var(--u) * .14));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.4), 0 0 0 1px var(--key-edge),
              0 calc(var(--u) * .04) calc(var(--u) * .18) rgba(0,0,0,.45);
  filter: brightness(.96);
}
.key:focus-visible { outline: calc(var(--u)*.22) solid #2f9bff; outline-offset: 2px; }

.key.big { font-size: calc(var(--u) * 1.5); }
.key .glyph { font-size: calc(var(--u) * 1.35); line-height: 1; }

/* the shifted character printed in yellow above the legend */
.key .sup {
  position: absolute; top: calc(var(--u) * .18); left: calc(var(--u) * .38);
  font-size: calc(var(--u) * .8);
}
/* The number pad's shifted characters run half again bigger. They are the ones an
   operator actually hunts for — & @ : % $ ! * ' ? + = # are the whole punctuation
   set for typing a program — whereas the three in the alpha block sit beside keys
   whose own legend already says what they are. */
.grp-numeric .sup { font-size: calc(var(--u) * 1.2); }

/* The yellow legends — the shifted characters and the SHIFT key itself. The
   contrast comes from the fill (see --yellow-deep), so no shadow: every outline
   tried here ate the counters of 9px letterforms and read darker than the glyph. */
.key .sup, .key.shift { color: var(--yellow-deep); }

/* SHIFT sits in the alpha block, so it is sized off the letters beside it —
   three-quarters of their 1.5, because a five-letter word set as big as a single
   A crowds its key. */
.key.shift { font-size: calc(var(--u) * 1.125); }

.key.cyan {
  background: linear-gradient(180deg, #9adcf2 0%, #56c0e4 40%, #29a8d6 74%, #0f8ec0 100%);
}
.key.reset {
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.55);
  font-size: calc(var(--u) * 1.5);
  letter-spacing: .1em;
  background: linear-gradient(180deg, #ffb35c 0%, var(--reset-hi) 38%, var(--reset-lo) 72%, #a8300f 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), 0 0 0 calc(var(--u)*.22) var(--reset-edge),
              0 calc(var(--u) * .16) 0 #4d0607, 0 calc(var(--u) * .3) calc(var(--u) * .35) rgba(0,0,0,.45);
}

/* Mode keys carry a notched left edge on the real panel, which is how an operator
   picks them out of the block at a glance — see F2.26. */
.key.mode {
  clip-path: polygon(0 26%, 13% 0, 100% 0, 100% 100%, 13% 100%, 0 74%);
  border-radius: 0 var(--key-r) var(--key-r) 0;
  padding-left: calc(var(--u) * .75);
}

/* X jog keys print the arrow beside the legend, not above it */
.key.inline { flex-direction: row; gap: calc(var(--u) * .25); }

/* ----------------------------------------------------- the two exceptions

   Development scaffolding, not part of the real control, and now inverted: with
   100 of 132 keys live, tinting what works would mean tinting nearly the whole
   panel and saying nothing. So a working key is left ALONE — it simply looks like
   the key it is — and only the two exceptions are marked.

   `todo`  — not built yet. A muted wash, because it is coming.
   `na`    — nothing underneath it on this machine, ever. Faded legends as well,
             because "never" must not look like "not yet".

   Both stay pressable, and both say what they are when pressed. Remove this
   block, plus VERIFIED and UNAVAILABLE in keys.js, once the panel is complete —
   a real HAAS has no such distinction. */
.key.todo::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  background: rgba(120, 130, 145, .22);
  pointer-events: none;
}
.key.todo .lines, .key.todo .glyph, .key.todo .sup { opacity: .62; }
.key.todo { box-shadow:
    inset 0 0 0 1px rgba(90, 100, 115, .5),
    0 0 0 1px #7d8288,
    0 calc(var(--u) * .16) 0 #8b9097,
    0 calc(var(--u) * .3) calc(var(--u) * .35) rgba(0, 0, 0, .4); }

.key.na .lines, .key.na .glyph, .key.na .sup { opacity: .3; }
.key.na::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  background: rgba(24, 26, 28, .2);
  pointer-events: none;
}

/* keep legends above the wash */
.key .sup, .key .glyph { z-index: 1; }


/* the yellow wedge on the rotary-axis keys */
.key .corner {
  position: absolute; width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5);
  background: var(--yellow);
}
.key .corner.tl { top: 0; left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); border-top-left-radius: var(--key-r); }
.key .corner.br { bottom: 0; right: 0; clip-path: polygon(100% 100%, 100% 0, 0 100%); border-bottom-right-radius: var(--key-r); }
.key .lines {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
}

/* the divider the MDI/DNC key carries between its two legends */
.key.rule .lines > span:first-child { border-bottom: 1px solid #17191b; padding-bottom: 1px; }

/* --------------------------------------------- the always-visible position

   A deliberate departure from the HAAS layout. On the machine this strip is the
   same size as everything around it; here it is the one readout an operator
   watches continuously while jogging, and it was 12px sitting in a pane with 30px
   of unused space in it. So the numbers take all of it.

   The pane height is unchanged — this spends slack that was already there, plus
   the axis-letter row, which becomes a small label rather than a line of its own.
   Scoped to this pane on purpose: the big DRO on the POSITION page is untouched. */
.pane-position { padding-left: 0; padding-right: 0; }
.pane-position h3 { padding-left: calc(var(--u) * .45); }

/* X value  Y value  Z value  A value, on one line, top aligned.
   Width is what limits this, not height — four eight-character readings plus
   their letters is 40 characters across a 781px pane, so the type size is
   whatever divides into that, and taking the header row away bought height the
   readout could not spend. Every pixel inside the pane goes to the digits: no
   side padding, no column gaps, the letter as small as stays legible. */
.pane-position .axisrow {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  column-gap: calc(var(--u) * .35);
  align-content: start;          /* top aligned, as asked */
  height: 100%;
}
/* The letter hugs its own number rather than sitting at the left of the cell.
   With the number right-aligned and the letter pinned left, "40.000" and the
   next "Y" ended up touching and read as one token. Keeping the pair together
   puts the slack on the left of each group, which separates them for free. */
.pane-position .axisrow > div {
  display: flex; align-items: baseline; justify-content: flex-end;
  gap: calc(var(--u) * .15);
  min-width: 0;
}
.pane-position .axisrow i {
  font-style: normal;
  font-size: calc(var(--u) * .8);
  color: var(--screen-dim);
  flex: none;
}
/* The digits are as tall as the pane's own height allows — the limit is the 62px
   of row height, not the cell width, because the glyphs are narrowed to fit.
   Eight characters at 58.1px is 280px of natural advance against a 212px cell, so
   they run at 72% width. Two details make that safe rather than clever:

   - the box keeps its natural 8ch width so the text still fills it, and a negative
     left margin takes back exactly what the scale gives up. That is what keeps
     layout and paint agreeing. Sizing the box to the scaled width instead does
     not work: text-align only moves text when there is *spare* room, so text too
     wide for its box starts at the left edge and spills right into the next axis.
   - the scale is anchored to the right edge, which is the edge a DRO aligns on.

   --sx is the knob. Toward 1 gives rounder digits and a smaller readout; the
   font-size then has to come down to match, since width is what runs out first. */
.pane-position .axisrow span {
  --sx: .72;
  flex: none;
  display: inline-block;
  width: 8ch;                                  /* "-500.000", the widest reading */
  margin-left: calc(8ch * (var(--sx) - 1));    /* what scaleX gives up, taken back */
  text-align: right;
  transform: scaleX(var(--sx));
  transform-origin: 100% 50%;
  /* 4.2 would fit the row but pushes the pane 0.2px past its neighbours, and the
     whole point was to spend the height already there. */
  font-size: calc(var(--u) * 4.15);
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.pane.active .axisrow i { color: #4d6b54; }

/* --------------------------------------------------------------- the screen */

/* Power off. An unlit LCD is not black — it is cold glass with a faint sheen on
   it — and one rendered pure black reads as a broken display rather than a
   switched-off one. Same bezel, same size, nothing behind the glass. */
.screen.off {
  display: block;
  background:
    linear-gradient(147deg, rgba(255,255,255,.045) 0 22%, transparent 42%),
    linear-gradient(#0a0d0b, #070908 60%, #0b0e0c);
}

.screen {
  /* Height is set in units rather than by aspect ratio: the screen's width comes
     from the keyboard below it, and letting a 4:3 ratio drive the height made the
     display tower over the keypad, which is backwards from the real pendant. */
  height: calc(var(--u) * 31);
  background: #05140a;
  border-radius: calc(var(--u) * .4);
  /* Every tenth of a unit here is a row of text the main pane does not get, and
     the main pane is where the offset table and the program listing live. */
  padding: calc(var(--u) * .6);
  box-shadow: inset 0 0 0 calc(var(--u)*.5) #1b1e21, inset 0 0 calc(var(--u)*2.5) rgba(0,0,0,.85),
              0 calc(var(--u)*.3) calc(var(--u)*.8) rgba(0,0,0,.5);
  font-family: var(--font-screen);
  font-size: calc(var(--u) * .88);
  /* Tight leading. The screen lost a third of its height to fit 1080, and rows of
     text are what it spends that height on — 1.25 buys back about one row in
     eight without touching the type size. */
  line-height: 1.25;
  color: var(--screen-text);
  display: grid;
  gap: calc(var(--u) * .25);
  /* Column 1 (program, spindle, icons) narrowed twice: once to 90% of its
     original 1.15fr, then again to buy width for the POSITION readout, which is
     width-bound and spans columns 2 and 3. The exchange rate is poor — column 1
     gives up 100px to make the digits ~4px taller — so this is as far as it goes
     before the program listing stops holding a full g-code block. */
  grid-template-columns: .77fr 1fr .8fr .55fr;
  grid-template-rows: auto auto 1fr auto auto auto;
  /* Bottom band per the manual's prose: input bar "bottom, left corner"
     (p.53), status bar "bottom, center" (p.51), alarm at the right — not the
     icon bar squatting in the input bar's corner.

     The icon bar's left edge sits under POSITION rather than under the spindle
     pane, so MAIN SPINDLE takes the whole left column of both rows — the room
     its four readings (RPM, DIR, FEED and the three overrides, all of which
     F2.34 puts in this pane) need at the doubled type they are watched at. */
  grid-template-areas:
    "modebar modebar modebar modebar"
    "program codes   tool    coolant"
    "program main    main    main"
    "spindle position position timers"
    "spindle icons   icons   icons"
    "input   status  status  alarm";
}

.pane {
  background: var(--screen-pane);
  border-radius: calc(var(--u) * .2);
  padding: calc(var(--u) * .3) calc(var(--u) * .45);
  overflow: hidden;
  min-width: 0;
  display: flex; flex-direction: column;
}
.pane > h3 {
  margin: calc(var(--u) * -.3) calc(var(--u) * -.45) calc(var(--u) * .3);
  padding: calc(var(--u) * .16) calc(var(--u) * .45);
  background: #06210f;
  color: var(--screen-dim);
  font: inherit; font-size: calc(var(--u) * .85);
  letter-spacing: .08em;
}
.pane pre { margin: 0; font: inherit; white-space: pre; overflow: hidden; }

/* RPM and DIR at twice the screen's text size, for the same reason the position
   strip beside them is big: they are watched from a pace away, not read up close.
   Two lines at 24.6px is 61.6px of the pane's 62px, so this spends slack that was
   already there rather than pushing the row taller.

   Has to sit after `.pane pre`, not with the other pane rules above: the two
   selectors have equal specificity and `font: inherit` is a shorthand, so it
   resets font-size and the later rule wins. */
.pane-spindle pre { font-size: calc(var(--u) * 1.76); }

/* "The currently active pane has a white background. You can work with data in a
   pane only when that pane is active." — 2014 manual, 2.3.4 */
.pane.active { background: #f2f5f2; color: #10160f; }
.pane.active > h3 { background: #d5dbd5; color: #223226; }

.pane-modebar  { grid-area: modebar; }
.pane-program  { grid-area: program; }
.pane-codes    { grid-area: codes; }
.pane-tool     { grid-area: tool; }
.pane-coolant  { grid-area: coolant; }
.pane-main     { grid-area: main; }
.pane-spindle  { grid-area: spindle; }
.pane-position { grid-area: position; }
.pane-timers   { grid-area: timers; }
.pane-status   { grid-area: status; }
.pane-alarm    { grid-area: alarm; }
.pane-icons    { grid-area: icons; }
.pane-input    { grid-area: input; }

/* mode bar: mode on the left, active display function on the right */
.modebar {
  grid-area: modebar;
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(180deg, #3aa0d8, var(--cyan));
  color: #fff; font-weight: 700; letter-spacing: .12em;
  padding: calc(var(--u) * .22) calc(var(--u) * .6);
  border-radius: calc(var(--u) * .2);
}

.pane-alarm { background: #3a0d13; color: #ffd7dc; }
.pane-alarm.on { background: var(--screen-alarm); color: #fff; }

.dro { display: grid; grid-template-columns: auto repeat(4, 1fr); gap: 0 calc(var(--u)*.6); }
/* The position readouts are the largest text on a HAAS screen — an operator reads
   them from a pace away, through the window. */
/* Leading only. The numbers stay the size they were — the screen lost a third of
   its height to fit 1080 and 1.5 line-height no longer left room for the fourth
   row, so DIST TO GO was being cut off the bottom of the pane. */
.dro.big { font-size: calc(var(--u) * 1.7); line-height: 1.22; }
.dro.big b { font-size: calc(var(--u) * .95); align-self: center; }
.dro b { color: var(--screen-dim); font-weight: 400; }
.dro span { text-align: right; font-variant-numeric: tabular-nums; }
.pane.active .dro b { color: #4d6b54; }

.k { color: var(--screen-key); }
/* HELP's g-code labels are links to the reference pages. They keep the label
   colour they already had — a blue underlined word on a CRT-green pane reads as
   a web page pasted into a control — and only the underline says "clickable". */
.pane a { color: inherit; text-decoration: underline; text-underline-offset: .15em; }
.pane a:hover { color: var(--screen-active); }
.dim { color: var(--screen-dim); }
.pane.active .dim { color: #4d6b54; }
.pane.active .k { color: #7a5c00; }

/* the running block, highlighted from Ln: in the status report */
.cur { background: var(--screen-key); color: #10160f; }
/* CURRENT COMMANDS lists every modal group at once. One column of fourteen rows
   does not fit a screen that has to clear 1080; two columns of seven does, and the
   pane is wide enough that nothing has to shrink to manage it. */
.two-col { column-count: 2; column-gap: calc(var(--u) * 1.4); }

/* a block BLOCK DELETE will skip — shown, not hidden, so the switch is visible */
.skipped { opacity: .38; }
/* PROGRAM line numbers, Setting 1000. Opacity rather than a colour: the row
   underneath may be the highlighted running block, and a dim green on that
   amber is unreadable where a fade works on either ground. */
.ln { opacity: .5; }

</style>
<style>
  /* Nothing outside the pendant any more. A real HAAS has no "which machine am I
     talking to" control and no file picker, so both live behind POWER ON — which
     is where a machine's power lives anyway.

     Native <dialog>: modal, focus-trapped, dismissable with Escape, and none of
     that written by hand. */
  #power {
    border: 1px solid #39424a; border-radius: 4px; padding: 0;
    background: #16191d; color: #9fb3a6;
    font: 13px/1.6 ui-monospace, monospace;
    box-shadow: 0 1rem 3rem rgba(0,0,0,.6);
  }
  #power::backdrop { background: rgba(0,0,0,.55); }
  #power form { display: grid; gap: .7rem; padding: 1.1rem 1.3rem; min-width: 24rem; }
  #power h2 {
    margin: 0; font-size: 12px; letter-spacing: .18em; color: #7fd39b;
    text-transform: uppercase; font-weight: 400;
  }
  #power hr { border: none; border-top: 1px solid #2a3138; margin: .2rem 0; width: 100%; }
  #power label { display: grid; grid-template-columns: 6.5rem 1fr; align-items: center; gap: .6rem; }
  #power select, #power input, #power button {
    font: inherit; background: #21262b; color: #d6e4da;
    border: 1px solid #39424a; padding: .25rem .45rem;
  }
  #power button { cursor: pointer; }
  #power .row { display: flex; gap: .5rem; justify-content: flex-end; }
  #power .note { color: #6d7d84; font-size: 11px; }
  #power .ok { color: #7fd39b; }
  #power .bad { color: #e06c75; }
</style>

<dialog id="power">
  <form method="dialog">
    <h2>Control power on</h2>

    <label>Machine
      <select id="kind">
        <option value="sim">Simulator</option>
        <option value="websocket">WebSocket</option>
        <option value="serial">USB serial</option>
      </select>
    </label>
    <label>Address <input id="host" placeholder="board address" size="16"></label>
    <span id="link">not connected</span>
    <span class="note">The simulator needs no hardware. USB serial needs Chrome or
      Edge on localhost.</span>

    <hr>

    <label>Import <input type="file" id="file" accept=".nc,.gcode,.tap,.txt"></label>
    <span class="note">Reads a file from this computer into control memory. The
      machine's own card is reached from the pendant with RECEIVE, and SEND writes
      back to it.</span>

    <div class="row">
      <button id="connect" type="button">Connect</button>
      <button value="close">Close</button>
    </div>
  </form>
</dialog>

<main id="app"></main>
